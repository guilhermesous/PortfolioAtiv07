<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Portfólio de Projetos</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const projetos = [
            {
                titulo: "Projeto SafeShelf",
                descricao: "O SafeShelf foi construído com o principal propósito: ajudar pequenos e médios comerciantes no monitoramento do estoque e controle do vencimento dos produtos.",
                link: "https://github.com/guilhermesous/SafeShelf"
            },
            {
                titulo: "Projeto TaskManager",
                descricao: "App criado em Mendix com propósito de criar tarefas com descrição, data, status, urgência e atribuir responsáveis cadastrados no app.",
                link: "https://github.com/guilhermesous/TaskManager"
            }
        ];

        function Header() {
            return (
                <header>
                    <h1>Guilherme Sousa</h1>

                    <nav>
                        <ul id="headerlist">
                            <li>Sobre</li>
                            <li>Projetos</li>
                            <li>Contato</li>
                        </ul>
                    </nav>
                </header>
            );
        }

        function Sobre() {
            return (
                <section id="sec-sobre">
                    <h2>Sobre Mim</h2>

                    <img
                        src="https://avatars.githubusercontent.com/u/142254512?v=4"
                        alt="Foto de Guilherme Sousa"
                    />

                    <p>
                        Sou Guilherme, tenho 22 anos, atualmente almejo a posição
                        e conhecimento de Desenvolvedor Full Stack, tenho habilidade
                        com as linguagens Python, Java e Javascript no Back-End,
                        já no Front-End possuo habilidades com HTML, CSS,
                        Bootstrap e Javascript.
                    </p>
                </section>
            );
        }

        function Projetos({ projetos }) {
            return (
                <section>
                    <h2>Meus Projetos</h2>

                    <div id="div-cards">
                        {projetos.map((projeto, index) => (
                            <article key={index}>
                                <h3>{projeto.titulo}</h3>

                                <p className="limite-texto">
                                    {projeto.descricao}
                                </p>

                                <a
                                    href={projeto.link}
                                    target="_blank"
                                    rel="noreferrer"
                                >
                                    Link do Github
                                </a>
                            </article>
                        ))}
                    </div>
                </section>
            );
        }

        function Contato() {
            const enviarFormulario = (event) => {
                event.preventDefault();

                const form = event.target;

                const nome = form.nome.value.trim();
                const email = form.email.value.trim();
                const mensagem = form.mensagem.value.trim();

                if (!nome || !email || !mensagem) {
                    alert("Preencha todos os campos!");
                    return;
                }

                alert("Formulário enviado com sucesso!");
                form.reset();
            };

            return (
                <section>
                    <h2>Contato</h2>

                    <form onSubmit={enviarFormulario}>
                        <label>
                            Nome <br />
                            <input type="text" name="nome" />
                        </label>

                        <br />

                        <label>
                            E-mail <br />
                            <input type="email" name="email" />
                        </label>

                        <br />

                        <label>
                            Mensagem <br />
                            <textarea name="mensagem"></textarea>
                        </label>

                        <br />

                        <button type="submit">
                            Enviar
                        </button>
                    </form>
                </section>
            );
        }

        function Footer() {
            return (
                <footer>
                    <p>2026 - Desenvolvido por Guilherme Sousa</p>
                </footer>
            );
        }

        function App() {
            return (
                <>
                    <Header />
                    <Sobre />
                    <Projetos projetos={projetos} />
                    <Contato />
                    <Footer />
                </>
            );
        }

        ReactDOM.createRoot(
            document.getElementById("root")
        ).render(<App />);
    </script>
</body>
</html>
